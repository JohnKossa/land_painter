[project]
name = "land-painter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.10",
    "numpy>=2.3",
    "shapely>=2.1",
    "geopandas>=1.1",
    "pyogrio>=0.11",
    "pyproj>=3.7",
    "pyarrow>=21",
    "polars>=1.33",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
land-painter = "land_painter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/land_painter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/land_painter/map/assets/vendor"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B905"]  # zip() strict=: defensive, not a current bug — worth a separate audit

[tool.ruff.lint.flake8-bugbear]
# Qt's QModelIndex() is the idiomatic, cheap default for model methods.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # test helpers use short lambdas deliberately
