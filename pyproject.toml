[project]
name = "land-painter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.10",
    "numpy>=2.3",
    "shapely>=2.1",
    "geopandas>=1.1",
    "pyogrio>=0.11",
    "pyproj>=3.7",
    "pyarrow>=21",
    "polars>=1.33",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
land-painter = "land_painter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/land_painter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
