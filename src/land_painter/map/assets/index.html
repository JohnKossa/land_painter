<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Land Painter Map</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #dfe3e6; }
    #map { position: absolute; inset: 0; }
    #lasso { position: absolute; inset: 0; pointer-events: none; }
    #status { position: absolute; left: 8px; bottom: 8px; color: #ddd; font: 12px sans-serif;
              background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 3px; }
    #attribution { position: absolute; right: 0; bottom: 0; color: #222; font: 11px sans-serif;
                   background: rgba(255,255,255,0.75); padding: 1px 5px; }
    #attribution a { color: #1565c0; text-decoration: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="lasso"></canvas>
  <div id="status">Loading…</div>
  <div id="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions" target="_blank">CARTO</a></div>
  <script src="qwebchannel.js"></script>
  <script src="vendor/deck.gl.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
